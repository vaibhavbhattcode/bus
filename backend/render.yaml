# render.yaml — Render.com deployment configuration for BusBook API
# https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: busbook-api
    env: node
    plan: free          # change to 'starter' or 'standard' for production
    region: singapore   # closest to India
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/health

    # Environment variables — set actual secrets via Render dashboard (not here)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # === Set these via Render Dashboard (never hardcode secrets) ===
      - key: DATABASE_URL
        sync: false   # must be set manually
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false   # set to your Vercel URL
      # Mail
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

    autoDeploy: true

  # Uncomment if you need a dedicated Redis instance on Render
  # - type: redis
  #   name: busbook-redis
  #   plan: free
  #   region: singapore
  #   maxmemoryPolicy: allkeys-lru
